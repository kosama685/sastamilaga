name: Validate AI-readable navigation
on:
  pull_request:
    paths:
      - llms.txt
      - llms-full.txt
      - tools/validate-ai-site-index.mjs
      - .github/workflows/ai-site-index.yml
  push:
    branches: [main]
    paths:
      - llms.txt
      - llms-full.txt
      - tools/validate-ai-site-index.mjs
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: node --check tools/validate-ai-site-index.mjs
      - run: node tools/validate-ai-site-index.mjs
