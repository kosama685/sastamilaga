# Weekly Lighthouse audit (performance, accessibility, best practices, SEO) of the main page types.
# Reports are kept as downloadable artifacts. Runs against the deployed GitHub Pages copy; change the URLs when the real domain serves the site.
name: Lighthouse audit

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'   # every Monday 04:30 UTC

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Run Lighthouse (mobile) on the main page types
        run: |
          mkdir -p lh
          BASE="https://kosama685.github.io/sastamilaga"
          for p in "" "shop/" "b/" "contact/" "live-tv/" "c/automotive.html" "p/zy034-adjustable-desktop-mobile-phone-holder-premium-abs-metal-biaxial-bracket-s-hhc-3757902.html"; do
            name=$(echo "${p:-home}" | tr '/.' '--')
            npx --yes lighthouse@12 "$BASE/$p" --quiet --chrome-flags="--headless=new --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output=html --output-path="lh/$name" || true
          done
      - name: Summary
        run: |
          node -e "
          const fs=require('fs');
          for (const f of fs.readdirSync('lh').filter(x=>x.endsWith('.report.json'))) {
            const c=JSON.parse(fs.readFileSync('lh/'+f)).categories;
            console.log(f.replace('.report.json','').padEnd(40), Object.entries(c).map(([k,v])=>k.slice(0,4)+' '+Math.round(v.score*100)).join('  '));
          }"
      - uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lh/
