# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check of the site scripts (a broken script must never be deployed)
        run: |
          for f in app.js assets/js/*.js; do node --check "$f" || exit 1; done
      - name: Build blog posts that are due (any deploy publishes them, not only the daily schedule)
        run: node tools/build-blog.mjs
      - name: Clean URLs (section pages, clean links, sitemap entries)
        run: node tools/build-sections.mjs
      - name: Enhance all global category SEO with factual FAQ content and crawlable internal links
        run: node tools/enhance-global-category-seo.mjs
      - name: Build factual internal links for all indexable static product pages
        run: node tools/enhance-local-product-links.mjs
      - name: Build and validate quota-safe CJ product recovery index from all 451812 snapshot rows
        run: node tools/build-cj-static-lookup.mjs
      - name: Persist exact CJ recovery index in repository for both Pages deployment paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/cj/lookup/
          if git diff --cached --quiet; then
            echo "Verified static catalogue lookup unchanged."
          else
            git commit -m "data: persist complete CJ recovery lookup [skip ci]"
            git push origin HEAD:main
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
