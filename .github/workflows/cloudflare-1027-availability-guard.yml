name: Cloudflare Error 1027 public-route guard
on:
  # Check public availability every 15 minutes; never modify DNS, payment, or order routes.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/repair-cloudflare-public-routes.mjs'
      - 'tools/repair-cloudflare-public-routes.test.mjs'
      - '.github/workflows/cloudflare-1027-availability-guard.yml'
permissions:
  contents: read
concurrency:
  group: cloudflare-1027-public-route-guard
  cancel-in-progress: false
jobs:
  public-route-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify protected routes are never bypassed
        run: node --test tools/repair-cloudflare-public-routes.test.mjs
      - name: Identify verified zone without leaking credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing Cloudflare token"; exit 1; }
          ZONE=$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" 'https://api.cloudflare.com/client/v4/zones?name=sastamilaga.com' | jq -r '.result[0].id // empty')
          test -n "$ZONE" || { echo "::error::Zone not accessible"; exit 1; }
          echo "CLOUDFLARE_ZONE_ID=$ZONE" >> "$GITHUB_ENV"
      - name: Repair public Worker route mode while protecting account and API routes
        run: node tools/repair-cloudflare-public-routes.mjs --fix
      - name: Verify independent GitHub Pages storefront mirror
        run: |
          for url in 'https://kosama685.github.io/sastamilaga/' 'https://kosama685.github.io/sastamilaga/shop/'; do
            body=$(mktemp)
            status=$(curl -LsS --max-time 35 -o "$body" -w '%{http_code}' "$url") || status=000
            echo "Mirror $url HTTP $status; body bytes $(wc -c < "$body")"
            if [ "$status" = 200 ] && grep -qi 'Sasta Milaga' "$body"; then
              echo "PASS: independent public mirror contains Sasta Milaga branding"
            else
              echo "::warning::Mirror unavailable or does not match Sasta Milaga"
              grep -io -m 1 '<title>[^<]*</title>' "$body" || true
            fi
            rm -f "$body"
          done
      - name: Confirm public shop and homepage are not returning Error 1027
        run: |
          failed=0
          for url in 'https://sastamilaga.com/shop/' 'https://sastamilaga.com/'; do
            f=$(mktemp)
            h=$(mktemp)
            status=$(curl -L --max-time 35 --connect-timeout 15 --retry 1 --retry-delay 2 -sS -D "$h" -o "$f" -w '%{http_code}' "$url") || status=000
            if [ "$status" != 200 ] || grep -Eqi 'Error 1027|<title>Database Error</title>|HTTP ERROR 500|Service Unavailable' "$f" || ! grep -qi 'Sasta Milaga' "$f"; then
              echo "::error::Availability check failed: $url HTTP $status"
              grep -iE '^(HTTP/|server:|cf-ray:|cf-cache-status:|x-sasta-|retry-after:|content-type:)' "$h" | tail -18 || true
              # Only a short printable snippet from public error HTML, no request headers or secrets.
              head -c 220 "$f" | tr '\n' ' ' || true
              echo
              failed=1
            else
              echo "PASS $url HTTP $status"
            fi
            rm -f "$h" "$f"
          done
          exit "$failed"
      - name: Verify cart and checkout availability without placing orders
        run: |
          failed=0
          for url in 'https://sastamilaga.com/cart/' 'https://sastamilaga.com/checkout/'; do
            body=$(mktemp)
            headers=$(mktemp)
            result=$(curl -L --max-time 35 --connect-timeout 15 --retry 1 --retry-delay 2 -sS -D "$headers" -o "$body" -w '%{http_code} %{url_effective}' "$url") || result="000 $url"
            status=${result%% *}
            final_url=${result#* }
            echo "Commerce GET $url: HTTP $status (final path: ${final_url#https://sastamilaga.com})"
            if [ "$status" != "200" ] ||
               grep -Eqi 'Error 1027|<title>Database Error</title>|HTTP ERROR 500|Service Unavailable|This static cart has not been synchronized' "$body" ||
               [[ "$final_url" == *"github.io"* ]]; then
              echo "::error::Commerce availability failed at $url; HTTP $status"
              grep -iE '^(HTTP/|server:|cf-ray:|retry-after:|content-type:)' "$headers" | tail -12 || true
              failed=1
            fi
            rm -f "$body" "$headers"
          done
          exit "$failed"
