name: Meta Checkout Link — review-only contract tests
on:
  pull_request:
    paths:
      - "workers/meta-checkout-link/**"
      - ".github/workflows/meta-checkout-link-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate isolated Meta checkout router and simulated WooCommerce responses
        run: |
          node --check workers/meta-checkout-link/worker.mjs
          node --test workers/meta-checkout-link/worker.test.mjs
