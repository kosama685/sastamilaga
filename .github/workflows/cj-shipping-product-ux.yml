name: CJ product shipping choices and landed total
on:
  pull_request:
    paths:
      - assets/js/global-pdp.js
      - assets/js/global.js
      - assets/js/woo-bridge.js
      - assets/css/global-pdp.css
      - assets/templates/global-pdp.html
      - app.js
      - tools/cj-shipping-product-ux.test.mjs
      - tools/checkout-delivery-recovery.test.mjs
      - tools/digital-wallets.test.mjs
      - assets/js/digital-wallets.js
      - assets/js/config.js
      - .github/workflows/cj-shipping-product-ux.yml
  push:
    branches: [main]
    paths:
      - assets/js/global-pdp.js
      - assets/js/global.js
      - assets/js/woo-bridge.js
      - assets/css/global-pdp.css
      - assets/templates/global-pdp.html
      - app.js
      - tools/cj-shipping-product-ux.test.mjs
      - tools/checkout-delivery-recovery.test.mjs
      - tools/digital-wallets.test.mjs
      - assets/js/digital-wallets.js
      - assets/js/config.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Static JavaScript syntax
        run: |
          node --check assets/js/global-pdp.js
          node --check assets/js/woo-bridge.js
          node --check assets/js/global.js
          node --check app.js
          node --check assets/js/digital-wallets.js
      - name: CJ carrier and price regression tests
        run: node --test tools/cj-shipping-product-ux.test.mjs tools/checkout-delivery-recovery.test.mjs tools/digital-wallets.test.mjs
