# Independent Live TV maintenance: never block scheduled blog publishing.
name: Refresh Live TV channels
on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Refresh and inspect supplier channel list (bounded)
        timeout-minutes: 25
        run: node tools/build-livetv.mjs --check
      - name: Commit Live TV data only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sasta-milaga-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/livetv
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh Live TV channel snapshot"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v6
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.commit.outputs.changed == 'true'
        with:
          path: '.'
      - uses: actions/deploy-pages@v5
        if: steps.commit.outputs.changed == 'true'
        id: deployment
