# Publish due blog entries without network-heavy Live TV maintenance.
# 19:10 UTC = 00:10 Asia/Karachi; builder is deterministic and deduplicates.
name: Publish scheduled blog posts

on:
  schedule:
    - cron: '10 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-schedule.yml'
      - 'tools/build-blog.mjs'
      - 'tools/verify-blog-publication.mjs'
      - 'assets/data/blog.js'
      - 'assets/data/blog-wp.js'
      - 'data/wp/posts/**'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# Share the existing Pages deployment lock to avoid simultaneous GitHub Pages releases.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Build due posts without duplicates
        run: node tools/build-blog.mjs
      - name: Validate every due post locally
        run: node tools/verify-blog-publication.mjs --local
      - name: Commit only blog and sitemap changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sasta-milaga-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A b sitemap-blog.xml sitemap.xml sitemap_index.xml b-published.txt
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish due blog posts"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check live published article HTML and canonical links
        run: node tools/verify-blog-publication.mjs --live
      - name: Report publishing failure without blocking cleanup
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Blog publish failed: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Blog publishing failed: run $GITHUB_RUN_ID" --body "Investigate and retry the failed blog publishing workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
