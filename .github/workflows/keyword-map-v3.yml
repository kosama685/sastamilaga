name: Keyword V3 source integrity
on:
  pull_request:
    paths:
      - 'tools/generate_product_keywords_v3.py'
      - 'tools/test_generate_product_keywords_v3.py'
      - '.github/workflows/keyword-map-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tools -p test_generate_product_keywords_v3.py -v
      - run: |
          python3 tools/export-global-keyword-inventory.py
          python3 tools/generate_product_keywords_v3.py artifacts/global-keywords/page-keyword-inventory.csv --output artifacts/keyword-map-v3.zip
      - uses: actions/upload-artifact@v7
        with:
          name: keyword-map-v3
          path: artifacts/keyword-map-v3.zip
          retention-days: 30
