name: Indexing recovery inspection
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed indexing patch after backing up live configuration
        type: boolean
        default: false
      stage:
        description: Reviewed deployment stage
        type: choice
        options: [initial, links, blog]
        default: initial
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Read live routing and security configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/inspect-indexing-edge.mjs
      - name: Verify the reviewed policy
        run: node --test tools/indexing-edge-policy.test.mjs tools/indexing-blog-recovery.test.mjs
      - name: Apply reviewed indexing fixes
        if: inputs.apply
        env:
          INDEXING_STAGE: ${{ inputs.stage }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/deploy-indexing-edge.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: encrypted-indexing-diagnostic
          path: artifacts/indexing-diagnostic.enc.json
          retention-days: 2
      - uses: actions/upload-artifact@v6
        if: inputs.apply && always()
        with:
          name: indexing-deployment-receipt
          path: artifacts/indexing-deployment.json
          if-no-files-found: ignore
