name: Indexing recovery inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Read live routing and security configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/inspect-indexing-edge.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: encrypted-indexing-diagnostic
          path: artifacts/indexing-diagnostic.enc.json
          retention-days: 2
