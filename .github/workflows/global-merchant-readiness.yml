name: Audit full CJ catalogue for Merchant readiness (no submission)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - tools/audit-global-merchant-readiness.mjs
      - .github/workflows/global-merchant-readiness.yml
  pull_request:
    paths:
      - tools/audit-global-merchant-readiness.mjs
      - .github/workflows/global-merchant-readiness.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Validate every supplier catalogue record without asserting merchant eligibility
        run: node tools/audit-global-merchant-readiness.mjs
      - name: Archive full coverage / readiness audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: global-merchant-readiness-audit
          path: artifacts/global-merchant-readiness-audit.json
          retention-days: 30
          if-no-files-found: warn
