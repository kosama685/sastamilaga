# Deploys the Cloudflare Workers (CJ shipping + variants, PayPal, global product pages) and sets their secrets from GitHub Secrets.
# Nothing runs until the repository secrets below exist; secret values never appear in the repository or in logs.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN     API token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID    the account id shown in the Cloudflare dashboard
#   CJ_API_KEY               CJ Dropshipping API key (rotate the one that was pasted in chat)
#   PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, PAYPAL_WEBHOOK_ID   (optional: PayPal Worker)
name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["workers/**", ".github/workflows/workers.yml"]

permissions:
  contents: read

jobs:
  workers:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check that the Cloudflare secrets exist
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set as repository secrets, so no Worker was deployed."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy CJ shipping and variants Worker
        if: steps.chk.outputs.ok == 'true'
        working-directory: workers/cj-shipping
        run: |
          npx --yes wrangler@3 deploy
          if [ -n "$CJ_API_KEY" ]; then printf '%s' "$CJ_API_KEY" | npx --yes wrangler@3 secret put CJ_API_KEY; else echo "::warning::CJ_API_KEY secret is not set: the Worker is deployed but cannot call CJ yet."; fi
      - name: Deploy PayPal Worker
        if: steps.chk.outputs.ok == 'true'
        working-directory: workers/paypal
        run: |
          npx --yes wrangler@3 deploy
          [ -n "$PAYPAL_CLIENT_ID" ]     && printf '%s' "$PAYPAL_CLIENT_ID"     | npx --yes wrangler@3 secret put PAYPAL_CLIENT_ID     || echo "::warning::PAYPAL_CLIENT_ID not set"
          [ -n "$PAYPAL_CLIENT_SECRET" ] && printf '%s' "$PAYPAL_CLIENT_SECRET" | npx --yes wrangler@3 secret put PAYPAL_CLIENT_SECRET || echo "::warning::PAYPAL_CLIENT_SECRET not set"
          [ -n "$PAYPAL_WEBHOOK_ID" ]    && printf '%s' "$PAYPAL_WEBHOOK_ID"    | npx --yes wrangler@3 secret put PAYPAL_WEBHOOK_ID    || echo "::warning::PAYPAL_WEBHOOK_ID not set"
          true
      - name: Deploy global product pages Worker
        if: steps.chk.outputs.ok == 'true'
        working-directory: workers/product-pages
        run: npx --yes wrangler@3 deploy
