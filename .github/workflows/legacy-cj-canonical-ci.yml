name: Verify legacy global product migration
on:
  pull_request:
    paths: [tools/legacy-cj-product-canonical-redirect.mjs,tools/legacy-cj-product-canonical-redirect.test.mjs,.github/workflows/legacy-cj-canonical-ci.yml]
  push:
    branches: [main]
    paths: [tools/legacy-cj-product-canonical-redirect.mjs,tools/legacy-cj-product-canonical-redirect.test.mjs,.github/workflows/legacy-cj-canonical-ci.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: node --check tools/legacy-cj-product-canonical-redirect.mjs
      - run: node --test tools/legacy-cj-product-canonical-redirect.test.mjs
