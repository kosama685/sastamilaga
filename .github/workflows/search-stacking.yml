name: Search suggestions stacking regression
on:
  pull_request:
    paths:
      - 'assets/js/search-suggest.js'
      - 'tools/search-stacking.test.mjs'
  push:
    branches: [main]
    paths:
      - 'assets/js/search-suggest.js'
      - 'tools/search-stacking.test.mjs'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: '24'}
      - run: node --check assets/js/search-suggest.js
      - run: node --test tools/search-stacking.test.mjs
