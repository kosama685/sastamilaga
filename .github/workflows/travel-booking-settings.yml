name: Travel booking settings (WordPress)
# Sends the flight-booking switches and the Duffel access tokens from GitHub to WordPress
# (wordpress/mu-plugins/sm-flight-booking.php → POST /wp-json/sm-travel/v1/admin/settings, administrators only).
# Tokens are stored encrypted on the server; this log only shows yes/no flags. See docs/travel-booking.md.
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   WORDPRESS_URL, WORDPRESS_USERNAME, WORDPRESS_APP_PASSWORD   already used by the blog workflows (administrator app password)
#   DUFFEL_TEST_TOKEN   duffel_test_…  (Duffel dashboard, test mode)          optional
#   DUFFEL_LIVE_TOKEN   duffel_live_…  (a NEWLY ROTATED live token)            optional
# Repository variable (… → Variables):
#   TRAVEL_MARKUP_PERCENT   e.g. 20 (markup on the airline base fare; taxes passed through)   optional
on:
  workflow_dispatch:
    inputs:
      status_only:
        description: 'Only read the current status (change nothing)'
        type: boolean
        default: true
      environment:
        description: 'Duffel environment for public search'
        type: choice
        options: [test, live]
        default: test
      send_tokens:
        description: 'Send the DUFFEL_TEST_TOKEN / DUFFEL_LIVE_TOKEN secrets'
        type: boolean
        default: false
      production_approved:
        description: 'Live use approved by the owner'
        type: boolean
        default: false
      flights_search:
        description: 'Show live airline fares on /travel/'
        type: boolean
        default: false
      online_booking:
        description: 'Let customers book and pay online (needs both confirmations below)'
        type: boolean
        default: false
      ack_balance:
        description: 'I confirm the Duffel balance is funded'
        type: boolean
        default: false
      ack_paypal:
        description: 'I confirm PayPal approved this account for airline tickets'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: travel-booking-settings
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7   # only docs/ (the runbook); the job itself just calls the WordPress API
        with:
          sparse-checkout: docs
          persist-credentials: false
      - name: Apply or read travel booking settings
        env:
          WP_URL: ${{ secrets.WORDPRESS_URL }}
          WP_USER: ${{ secrets.WORDPRESS_USERNAME }}
          WP_PASS: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          DUFFEL_TEST_TOKEN: ${{ secrets.DUFFEL_TEST_TOKEN }}
          DUFFEL_LIVE_TOKEN: ${{ secrets.DUFFEL_LIVE_TOKEN }}
          MARKUP: ${{ vars.TRAVEL_MARKUP_PERCENT }}
          STATUS_ONLY: ${{ inputs.status_only }}
          IN_ENV: ${{ inputs.environment }}
          SEND_TOKENS: ${{ inputs.send_tokens }}
          IN_APPROVED: ${{ inputs.production_approved }}
          IN_SEARCH: ${{ inputs.flights_search }}
          IN_BOOKING: ${{ inputs.online_booking }}
          IN_ACK_BALANCE: ${{ inputs.ack_balance }}
          IN_ACK_PAYPAL: ${{ inputs.ack_paypal }}
        run: |
          set -euo pipefail
          for v in WP_URL WP_USER WP_PASS; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret for $v is not set"; exit 1; fi
          done
          base="${WP_URL%/}/wp-json/sm-travel/v1"
          if [ "$STATUS_ONLY" = "true" ]; then
            code=$(curl -sS -o resp.json -w '%{http_code}' -u "$WP_USER:$WP_PASS" "$base/admin/status")
          else
            body=$(jq -n --arg env "$IN_ENV" --argjson pa "$IN_APPROVED" --argjson fs "$IN_SEARCH" --argjson ob "$IN_BOOKING" \
                         --argjson ab "$IN_ACK_BALANCE" --argjson ap "$IN_ACK_PAYPAL" \
                         '{environment:$env, production_approved:$pa, flights_search:$fs, online_booking:$ob, ack_balance:$ab, ack_paypal:$ap}')
            if [ "$SEND_TOKENS" = "true" ]; then
              if [ -n "$DUFFEL_TEST_TOKEN" ]; then body=$(jq --arg t "$DUFFEL_TEST_TOKEN" '. + {duffel_test_token:$t}' <<<"$body"); else echo "::notice::DUFFEL_TEST_TOKEN secret not set (skipped)"; fi
              if [ -n "$DUFFEL_LIVE_TOKEN" ]; then body=$(jq --arg t "$DUFFEL_LIVE_TOKEN" '. + {duffel_live_token:$t}' <<<"$body"); else echo "::notice::DUFFEL_LIVE_TOKEN secret not set (skipped)"; fi
            fi
            if [ -n "$MARKUP" ]; then body=$(jq --argjson m "$MARKUP" '. + {markup_percent:$m}' <<<"$body"); fi
            code=$(curl -sS -o resp.json -w '%{http_code}' -u "$WP_USER:$WP_PASS" -H 'Content-Type: application/json' --data-binary @- "$base/admin/settings" <<<"$body")
          fi
          echo "HTTP $code"
          jq . resp.json 2>/dev/null || head -c 400 resp.json
          if [ "$code" != "200" ]; then
            echo "::error::WordPress answered $code. 401/403: the user behind WORDPRESS_APP_PASSWORD must be an administrator. 404: sm-flight-booking.php is not installed."
            exit 1
          fi
          {
            echo "### Travel booking status"
            echo
            jq -r 'to_entries[] | select(.key != "last_test") | "- **\(.key)**: \(.value)"' resp.json
          } >> "$GITHUB_STEP_SUMMARY"
