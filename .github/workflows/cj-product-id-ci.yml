name: Test all CJ supplier ID formats
on:
  pull_request:
    paths:
      - tools/global-product-uuid-and-numeric-worker.mjs
      - tools/global-product-uuid-and-numeric-worker.test.mjs
      - .github/workflows/cj-product-id-ci.yml
  push:
    branches: [main]
    paths:
      - tools/global-product-uuid-and-numeric-worker.mjs
      - tools/global-product-uuid-and-numeric-worker.test.mjs
      - .github/workflows/cj-product-id-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/global-product-uuid-and-numeric-worker.mjs
      - run: node --test tools/global-product-uuid-and-numeric-worker.test.mjs
