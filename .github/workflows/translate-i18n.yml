name: Translate interface strings (machine, unreviewed)
on:
  schedule:
    - cron: "17 3 * * 1"        # Mondays 03:17 UTC; only missing strings are translated
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated language codes to run (empty = all)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: translate-i18n
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Translate with Workers AI (@cf/meta/m2m100-1.2b)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
        run: node tools/translate-i18n.mjs
      - name: Commit new strings
        run: |
          git config user.name "i18n-bot"
          git config user.email "i18n-bot@users.noreply.github.com"
          git add data/i18n/mt
          if git diff --staged --quiet; then echo "nothing new"; else git commit -m "i18n: machine translations (unreviewed, no hreflang)" && git pull --rebase -q && git push; fi
