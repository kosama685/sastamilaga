name: Local product navigation and supplier image integrity
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'assets/js/related-product-cards.js'
      - 'assets/js/chrome.js'
      - 'assets/theme/static-bundle.css'
      - 'tools/test-local-pdp-navigation.mjs'
      - '.github/workflows/local-product-journey-quality.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate modified JS
        run: |
          node --check app.js
          node --check assets/js/related-product-cards.js
          node --check tools/test-local-pdp-navigation.mjs
      - name: Product URL image ownership and cart-safety contract
        run: node tools/test-local-pdp-navigation.mjs
      - name: Verify two public production entrypoints
        run: |
          node --input-type=module - <<'NODE'
          const base='https://sastamilaga.com';
          const urls=['/app.js','/assets/js/related-product-cards.js','/p/electric-super-micro-bubble-beauty-blackhead-remover-pore-vacuum-cleaner-facial-pe-96-00-00-964.html'];
          for(const url of urls){
            const response=await fetch(base+url,{signal:AbortSignal.timeout(20000),headers:{'User-Agent':'SastaLocalPdpCI/1.0'}});
            if(response.status!==200)throw Error(url+' HTTP '+response.status);
            const body=await response.text();
            if(url.endsWith('/app.js')&&!body.includes('Product pages are authoritative static documents'))throw Error('production app.js has not propagated');
            if(url.endsWith('related-product-cards.js')&&!body.includes("'admin.yourmart.pk'"))throw Error('supplier image allowlist has not propagated');
            if(url.endsWith('.html')&&!body.includes('rel="canonical"'))throw Error('canonical missing');
            console.log('PASS',url,response.status);
          }
          NODE
