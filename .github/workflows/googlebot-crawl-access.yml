name: Verified Google crawler access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  googlebot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Apply narrowly scoped current Google IP allowlist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 tools/update-googlebot-rule.py
      - uses: actions/upload-artifact@v7
        with:
          name: verified-googlebot-rule
          path: artifacts/googlebot-rule.json
