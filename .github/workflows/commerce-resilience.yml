name: Local and CJ commerce resilience checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/js/woo-bridge.js
      - assets/js/global.js
      - assets/js/cj-home-rails.js
      - assets/js/global-pdp.js
      - tools/woo-bridge-flow.test.mjs
      - tools/cj-cart-handoff.test.mjs
      - tools/cj-sku-awareness.test.mjs
      - tools/commerce-resilience.test.mjs
      - .github/workflows/commerce-resilience.yml
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Validate all affected browser scripts
        run: |
          node --check assets/js/woo-bridge.js
          node --check assets/js/global.js
          node --check assets/js/cj-home-rails.js
          node --check assets/js/global-pdp.js
      - name: Run no-purchase cart and CJ behavioral regression tests
        run: node --test tools/woo-bridge-flow.test.mjs tools/cj-cart-handoff.test.mjs tools/cj-sku-awareness.test.mjs tools/commerce-resilience.test.mjs
