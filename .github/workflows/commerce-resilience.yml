name: Local and CJ commerce resilience checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/commerce-resilience.yml
      - assets/js/global-pdp.js
      - assets/js/woo-bridge.js
      - tools/static-request-commerce.test.mjs
      - tools/github-only-commerce.test.mjs
      - tools/unified-order-request.test.mjs
  push:
    branches: [main]
    paths:
      - assets/js/woo-bridge.js
      - assets/js/cod-recovery.js
      - cod-checkout/index.html
      - assets/js/chrome.js
      - tools/cod-recovery.test.mjs
      - assets/js/global.js
      - assets/js/cj-home-rails.js
      - assets/js/global-pdp.js
      - assets/js/order-cart.js
      - assets/js/wordpress-checkout.js
      - tools/wordpress-checkout.test.mjs
      - assets/js/checkout-pricing.js
      - tools/checkout-pricing.test.mjs
      - order/index.html
      - assets/js/order-page.js
      - assets/js/global-quote-flow.js
      - assets/js/paypal-payment-link.js
      - tools/static-request-commerce.test.mjs
      - tools/github-only-commerce.test.mjs
      - tools/unified-order-request.test.mjs
      - tools/static-commerce-v2.test.mjs
      - tools/cod-recovery.test.mjs
      - .github/workflows/commerce-resilience.yml
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Validate all affected browser scripts
        run: |
          node --check assets/js/woo-bridge.js
          node --check assets/js/cod-recovery.js
          node --check assets/js/global.js
          node --check assets/js/cj-home-rails.js
          node --check assets/js/global-pdp.js
          node --check assets/js/paypal-payment-link.js
          node --check assets/js/order-cart.js
          node --check assets/js/wordpress-checkout.js
          node --check assets/js/checkout-pricing.js
          node --check assets/js/order-page.js
      # Legacy Woo nonce/Store API tests are retained in the repository, but they describe
      # the retired checkout and are not a production gate for request-only cart.
      # The replacement suite checks exact variants, no fake paid orders, Formspree
      # ambiguity, mixed local/CJ cart and missing shipping quotes.
      - name: Run unified unpaid request commerce regression tests
        run: |
          node --test tools/wordpress-checkout.test.mjs
          node --test tools/checkout-pricing.test.mjs
          node --test tools/global-quote-flow.test.mjs
          node --test tools/static-request-commerce.test.mjs
          node --test tools/github-only-commerce.test.mjs
          node --test tools/unified-order-request.test.mjs
          node --test tools/static-commerce-v2.test.mjs
          node --test tools/cod-recovery.test.mjs
