name: Freight continuity release validation
on:
  pull_request:
    paths:
      - 'tools/catalog-freight-continuity*'
      - 'tools/catalog-category-window*'
      - 'tools/migrations/20261125-cj-category-index-candidate.sql'
      - 'tools/migrations/20261125-catalog-sync-health.sql'
      - '.github/workflows/freight-continuity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test tools/catalog-freight-continuity-worker.test.mjs tools/catalog-category-window.test.mjs
