name: Restore independent static catalog search
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/restore-static-search-route.mjs
      - .github/workflows/restore-static-search.yml
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check tools/restore-static-search-route.mjs
      - run: node tools/restore-static-search-route.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: static-search-route-recovery
          path: artifacts/search-route-*.json
          if-no-files-found: ignore
